name: Calidad

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Estructura y lógica
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test

  browser:
    name: Navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Iniciar servidor
        run: python3 -m http.server 8000 > /tmp/ruta360-server.log 2>&1 &
      - name: Ejecutar prueba de navegador
        run: npm run test:browser
