name: Consolidar Clientes Automáticamente

on:
  push:
    paths:
      - 'data/**'                     # Se ejecuta al subir o modificar archivos en /data
      - '*.xlsx'                      # O si subes archivos Excel en la raíz
      - '*.csv'                       # O si subes archivos CSV en la raíz
  schedule:
    - cron: '0 12 * * *'             # 12:00 UTC = 6:00 AM El Salvador (calcula semana Par/Impar diariamente)
  workflow_dispatch:                 # Permite ejecutarlo manualmente desde GitHub Actions

# --- PERMISOS DE ESCRITURA DECLARADOS DIRECTAMENTE ---
permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librerías Requeridas
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Ejecutar Script de Consolidación
        run: python scripts/procesar_clientes.py

      - name: Guardar y Publicar 'clientes.csv' en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add clientes.csv
          git commit -m "Auto-update clientes.csv desde matriz [skip ci]" || exit 0
          git push
